<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SignBridge | 너의 귀가 되어줄께</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: rgba(255,255,255,0.07);
      --blue: #4f8eff;
      --green: #3dffa0;
      --red: #ff4f6a;
      --yellow: #ffd166;
      --text: #e8e8f0;
      --muted: #6b6b80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
    }
    .logo-icon {
      width: 28px; height: 28px;
      background: var(--blue);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .mode-tabs {
      display: flex;
      background: var(--bg);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }
    .mode-tab {
      padding: 6px 18px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-tab.active {
      background: var(--surface2);
      color: var(--text);
    }
    .status-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .camera-panel {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    #webcam {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: rotateY(180deg);
    }
    #output {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: rotateY(180deg);
      pointer-events: none;
    }
    .hand-border {
      position: absolute;
      inset: 20px;
      border: 1.5px solid rgba(79,142,255,0.2);
      border-radius: 20px;
      transition: border-color 0.3s;
      pointer-events: none;
    }
    .hand-border.detected {
      border-color: rgba(61,255,160,0.5);
      box-shadow: inset 0 0 40px rgba(61,255,160,0.05);
    }
    .result-overlay {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 36px;
      text-align: center;
      min-width: 280px;
      pointer-events: none;
    }
    .result-label {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .result-label.recognized { color: var(--green); }
    .result-conf {
      font-size: 11px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      margin-top: 4px;
    }
    .control-panel {
      width: 320px;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: var(--surface);
      overflow: hidden;
    }
    .panel-section {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .label-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .label-btn {
      padding: 8px 10px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .label-btn:hover { border-color: var(--blue); color: var(--blue); }
    .label-btn.selected {
      background: rgba(79,142,255,0.12);
      border-color: var(--blue);
      color: var(--blue);
    }
    .label-count {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      background: var(--bg);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .label-btn.selected .label-count { color: var(--blue); }
    .collect-area { display: flex; flex-direction: column; gap: 8px; }
    .selected-label-display {
      background: var(--surface2);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--muted);
    }
    .selected-label-display span { color: var(--blue); font-weight: 700; }
    .btn-collect {
      padding: 12px;
      background: var(--blue);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-collect:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-collect.collecting { background: var(--green); color: #000; }
    .btn-collect:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .progress-bar {
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--blue);
      border-radius: 2px;
      transition: width 0.3s;
    }
    .progress-text {
      font-size: 11px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      text-align: right;
    }
    .btn-train {
      padding: 12px;
      background: transparent;
      border: 1.5px solid var(--yellow);
      border-radius: 10px;
      color: var(--yellow);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      width: 100%;
    }
    .btn-train:hover { background: rgba(255,209,102,0.1); }
    .btn-train:disabled { opacity: 0.3; cursor: not-allowed; }
    .log-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .log-item {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      padding: 4px 8px;
      border-radius: 4px;
      background: var(--surface2);
    }
    .log-item.success { color: var(--green); }
    .log-item.error { color: var(--red); }
    .log-item.info { color: var(--blue); }
    .log-item.warn { color: var(--yellow); }
    .recognize-panel {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .tts-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface2);
      padding: 12px 14px;
      border-radius: 10px;
    }
    .toggle-label { font-size: 13px; }
    .toggle {
      width: 40px; height: 22px;
      background: var(--surface);
      border-radius: 11px;
      position: relative;
      cursor: pointer;
      border: 1.5px solid var(--border);
      transition: background 0.2s;
    }
    .toggle.on { background: var(--green); border-color: var(--green); }
    .toggle::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      background: #fff;
      border-radius: 50%;
      top: 1px; left: 1px;
      transition: left 0.2s;
    }
    .toggle.on::after { left: 19px; }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface2);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .history-word { font-weight: 700; color: var(--green); }
    .history-time { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
    .btn-clear {
      padding: 8px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-clear:hover { border-color: var(--red); color: var(--red); }
    .hidden { display: none !important; }
    .flash {
      position: absolute;
      inset: 0;
      background: rgba(61,255,160,0.15);
      animation: flash 0.3s ease forwards;
      pointer-events: none;
    }
    @keyframes flash {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <div class="logo-icon">🤟</div>
      SignBridge
    </div>
    <div class="mode-tabs">
      <button class="mode-tab active" onclick="setMode('collect')">데이터 수집</button>
      <button class="mode-tab" onclick="setMode('recognize')">실시간 인식</button>
    </div>
    <div class="status-dot">
      <div class="dot"></div>
      <span id="cam-status">카메라 연결 중</span>
    </div>
  </div>

  <div class="main">
    <div class="camera-panel">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="output"></canvas>
      <div class="hand-border" id="hand-border"></div>
      <div class="result-overlay">
        <div class="result-label" id="result-text">손을 비춰주세요</div>
        <div class="result-conf" id="result-conf">대기 중</div>
      </div>
    </div>

    <div class="control-panel">

      <!-- 수집 모드 -->
      <div id="collect-mode">
        <div class="panel-section">
          <div class="section-title">수어 선택</div>
          <div class="label-grid" id="label-grid"></div>
        </div>
        <div class="panel-section">
          <div class="section-title">데이터 수집</div>
          <div class="collect-area">
            <div class="selected-label-display">선택된 수어: <span id="selected-display">없음</span></div>
            <button class="btn-collect" id="btn-collect" onclick="toggleCollect()" disabled>수집 시작</button>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
            <div class="progress-text" id="progress-text">0 / 100</div>
          </div>
        </div>
        <div class="panel-section">
          <div class="section-title">모델 학습</div>
          <button class="btn-train" id="btn-train" onclick="trainModel()">🧠 AI 모델 학습 시작</button>
        </div>
        <div class="log-area" id="log-area"></div>
      </div>

      <!-- 인식 모드 -->
      <div id="recognize-mode" class="hidden">
        <div class="panel-section">
          <div class="section-title">설정</div>
          <div class="tts-toggle">
            <span class="toggle-label">🔊 TTS 음성 출력</span>
            <div class="toggle" id="tts-toggle" onclick="toggleTTS()"></div>
          </div>
        </div>
        <div class="recognize-panel">
          <div class="section-title">인식 기록</div>
          <div style="display:flex;justify-content:flex-end;margin-bottom:6px;">
            <button class="btn-clear" onclick="clearHistory()">기록 지우기</button>
          </div>
          <div class="history-list" id="history-list">
            <div style="color:var(--muted);font-size:12px;text-align:center;padding:20px;">수어 동작을 보여주세요</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    let currentMode = 'collect';
    let selectedLabel = null;
    let isCollecting = false;
    let collectCount = 0;
    const COLLECT_TARGET = 100;
    let ttsEnabled = false;
    let lastPrediction = '';
    let predictionCooldown = 0;
    let handDetected = false;
    let labelCounts = {};
    let frameCount = 0;

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = video.offsetWidth || window.innerWidth - 320;
      canvas.height = video.offsetHeight || window.innerHeight - 60;
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 500);

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0 && mode === 'collect') || (i === 1 && mode === 'recognize'));
      });
      document.getElementById('collect-mode').classList.toggle('hidden', mode !== 'collect');
      document.getElementById('recognize-mode').classList.toggle('hidden', mode !== 'recognize');
      if (mode === 'recognize') {
        document.getElementById('result-text').textContent = '손을 비춰주세요';
        document.getElementById('result-conf').textContent = '인식 대기 중';
      }
    }

    async function loadLabels() {
      try {
        const res = await fetch('/labels');
        const data = await res.json();
        labelCounts = data.counts;
        renderLabelGrid(data.labels, data.counts);
      } catch (e) { log('라벨 로드 실패', 'error'); }
    }

    function renderLabelGrid(labels, counts) {
      const grid = document.getElementById('label-grid');
      grid.innerHTML = '';
      labels.forEach(label => {
        const btn = document.createElement('button');
        btn.className = 'label-btn';
        btn.dataset.label = label;
        btn.innerHTML = `<span>${label}</span><span class="label-count">${counts[label] || 0}</span>`;
        btn.onclick = () => selectLabel(label, btn);
        grid.appendChild(btn);
      });
    }

    function selectLabel(label, btn) {
      selectedLabel = label;
      document.querySelectorAll('.label-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('selected-display').textContent = label;
      document.getElementById('btn-collect').disabled = false;
      collectCount = labelCounts[label] || 0;
      updateProgress();
    }

    function toggleCollect() {
      if (!selectedLabel) return;
      if (!handDetected) { log('손이 감지되지 않았습니다', 'error'); return; }
      isCollecting = !isCollecting;
      const btn = document.getElementById('btn-collect');
      btn.textContent = isCollecting ? '⏹ 수집 중지' : '수집 시작';
      btn.classList.toggle('collecting', isCollecting);
      if (isCollecting) log(`"${selectedLabel}" 수집 시작`, 'info');
      else log(`수집 중지 (${collectCount}개)`, 'warn');
    }

    async function sendLandmarks(landmarks) {
      if (!isCollecting || !selectedLabel) return;
      try {
        const res = await fetch('/collect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label: selectedLabel, landmarks })
        });
        const data = await res.json();
        collectCount = data.count;
        labelCounts[selectedLabel] = collectCount;
        updateProgress();
        // 라벨 카운트 업데이트
        const btn = document.querySelector(`.label-btn[data-label="${selectedLabel}"]`);
        if (btn) btn.querySelector('.label-count').textContent = collectCount;
        // 플래시
        const flash = document.createElement('div');
        flash.className = 'flash';
        document.querySelector('.camera-panel').appendChild(flash);
        setTimeout(() => flash.remove(), 300);

        if (collectCount >= COLLECT_TARGET) {
          isCollecting = false;
          document.getElementById('btn-collect').textContent = '수집 완료 ✓';
          document.getElementById('btn-collect').classList.remove('collecting');
          log(`"${selectedLabel}" ${collectCount}개 수집 완료!`, 'success');
        }
      } catch (e) {}
    }

    function updateProgress() {
      const pct = Math.min((collectCount / COLLECT_TARGET) * 100, 100);
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-text').textContent = `${collectCount} / ${COLLECT_TARGET}`;
    }

    async function trainModel() {
      const btn = document.getElementById('btn-train');
      btn.disabled = true;
      btn.textContent = '⏳ 학습 중...';
      log('AI 모델 학습 시작...', 'info');
      try {
        const res = await fetch('/train', { method: 'POST' });
        const data = await res.json();
        if (data.status === 'success') {
          log(`✅ 학습 완료! 정확도: ${data.accuracy}%`, 'success');
          log(`총 ${data.total_samples}개 샘플 사용`, 'info');
        } else {
          log(`❌ ${data.message}`, 'error');
        }
      } catch (e) { log('학습 요청 실패', 'error'); }
      btn.disabled = false;
      btn.textContent = '🧠 AI 모델 학습 시작';
    }

    async function predictSign(landmarks) {
      if (currentMode !== 'recognize') return;
      if (predictionCooldown > 0) { predictionCooldown--; return; }
      try {
        const res = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ landmarks })
        });
        const data = await res.json();
        const resultEl = document.getElementById('result-text');
        const confEl = document.getElementById('result-conf');
        if (data.label && data.message === 'success') {
          resultEl.textContent = data.label;
          resultEl.className = 'result-label recognized';
          confEl.textContent = `확신도: ${Math.round(data.confidence * 100)}%`;
          if (data.label !== lastPrediction) {
            lastPrediction = data.label;
            addHistory(data.label);
            if (ttsEnabled) speak(data.label);
            predictionCooldown = 15;
          }
        } else {
          resultEl.textContent = data.label || '인식 중...';
          resultEl.className = 'result-label';
          confEl.textContent = '분석 중';
        }
      } catch (e) {}
    }

    function speak(text) {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ko-KR';
      speechSynthesis.speak(utter);
    }

    function toggleTTS() {
      ttsEnabled = !ttsEnabled;
      document.getElementById('tts-toggle').classList.toggle('on', ttsEnabled);
    }

    function addHistory(label) {
      const list = document.getElementById('history-list');
      const empty = list.querySelector('div[style]');
      if (empty) empty.remove();
      const now = new Date().toLocaleTimeString('ko-KR');
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `<span class="history-word">${label}</span><span class="history-time">${now}</span>`;
      list.prepend(item);
    }

    function clearHistory() {
      document.getElementById('history-list').innerHTML = `
        <div style="color:var(--muted);font-size:12px;text-align:center;padding:20px;">수어 동작을 보여주세요</div>`;
      lastPrediction = '';
    }

    function log(msg, type = '') {
      const area = document.getElementById('log-area');
      const item = document.createElement('div');
      item.className = `log-item ${type}`;
      item.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      area.prepend(item);
      if (area.children.length > 30) area.lastChild.remove();
    }

    function onResults(results) {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      handDetected = !!(results.multiHandLandmarks && results.multiHandLandmarks.length > 0);
      document.getElementById('hand-border').classList.toggle('detected', handDetected);

      if (handDetected) {
        for (const landmarks of results.multiHandLandmarks) {
          drawConnectors(ctx, landmarks, HAND_CONNECTIONS, { color: 'rgba(79,142,255,0.4)', lineWidth: 1.5 });
          drawLandmarks(ctx, landmarks, { color: '#3dffa0', lineWidth: 1, radius: 3 });
        }

        const lmData = results.multiHandLandmarks[0].map(lm => ({ x: lm.x, y: lm.y, z: lm.z }));
        frameCount++;

        if (currentMode === 'collect' && isCollecting && frameCount % 5 === 0) {
          sendLandmarks(lmData);
        }
        if (currentMode === 'recognize' && frameCount % 10 === 0) {
          predictSign(lmData);
        }
        if (currentMode === 'collect') {
          document.getElementById('result-text').textContent = isCollecting ? '수집 중...' : '손 감지됨';
          document.getElementById('result-text').className = 'result-label';
          document.getElementById('result-conf').textContent = isCollecting ? `${collectCount}개 저장됨` : '수집 버튼을 누르세요';
        }
      } else {
        if (currentMode === 'collect') {
          document.getElementById('result-text').textContent = '손을 비춰주세요';
          document.getElementById('result-text').className = 'result-label';
          document.getElementById('result-conf').textContent = '대기 중';
        } else if (currentMode === 'recognize') {
          document.getElementById('result-text').textContent = '손을 비춰주세요';
          document.getElementById('result-text').className = 'result-label';
          document.getElementById('result-conf').textContent = '인식 대기 중';
        }
      }
      ctx.restore();
    }

    const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
    hands.onResults(onResults);

    const camera = new Camera(video, {
      onFrame: async () => { await hands.send({ image: video }); },
      width: 1280, height: 720
    });
    camera.start().then(() => {
      document.getElementById('cam-status').textContent = '카메라 연결됨';
      resizeCanvas();
    });

    loadLabels();
    log('SignBridge 시작됨', 'success');
  </script>
</body>
</html>
