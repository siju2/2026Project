<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이터 수집 센터 — 통합 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; color: #202124; margin: 0; }
        .dashboard-card { background: white; border-radius: 32px; border: 1px solid #f1f3f4; padding: 2rem; transition: all 0.3s ease; }
        .video-feed-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 24px; position: relative; overflow: hidden; }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotateY(180deg); }
        #input_video { display: none; }
        .collect-btn { background: #202124; color: white; border-radius: 32px; transition: all 0.2s; }
        .collect-btn:disabled { background: #e8eaed; color: #9aa0a6; cursor: not-allowed; }
        .log-container { background: #202124; color: #34a853; font-family: 'Courier New', Courier, monospace; font-size: 12px; height: 150px; overflow-y: auto; padding: 1rem; border-radius: 20px; }
        
        .custom-input {
            width: 100%;
            padding: 1rem 1.25rem;
            border-radius: 16px;
            border: 1px solid #f1f3f4;
            background-color: #f8f9fa;
            font-size: 1rem;
            transition: all 0.2s;
            outline: none;
        }
        .custom-input:focus {
            background-color: white;
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
        }
    </style>
</head>
<body class="pt-20">

    <header class="fixed top-0 left-0 w-full bg-white border-b border-gray-100 z-50 h-16 flex items-center px-8 justify-between">
        <div class="flex items-center gap-4">
            <a href="/" class="text-gray-400 hover:text-black transition-colors"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="font-bold text-gray-500 uppercase tracking-widest text-xs">Data Collection Center (Dual Hand)</h2>
        </div>
        <div id="connection-status" class="flex items-center gap-2 text-xs font-bold text-red-500">
            <span class="w-2 h-2 bg-red-500 rounded-full"></span> CAMERA OFF
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-8 pb-20">
        
        <div class="md:col-span-2 space-y-6">
            <div class="dashboard-card shadow-sm">
                <div class="video-feed-container">
                    <video id="input_video"></video>
                    <canvas id="output_canvas"></canvas>
                    <div id="loading-msg" class="absolute inset-0 flex items-center justify-center text-white font-medium bg-black/50">
                        인식 엔진 로딩 중...
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4 mt-8">
                    <button id="btn-collect" class="collect-btn py-5 flex flex-col items-center gap-2 shadow-lg">
                        <i class="fa-solid fa-record-vinyl animate-pulse"></i>
                        <span class="font-bold">데이터 수집 시작</span>
                    </button>
                    <button onclick="location.reload()" class="bg-gray-100 hover:bg-gray-200 py-5 rounded-[32px] flex flex-col items-center gap-2 transition-all">
                        <i class="fa-solid fa-arrows-rotate"></i>
                        <span class="text-xs font-bold text-gray-600">카메라 리셋</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="space-y-6">
            <div class="dashboard-card">
                <h3 class="text-xs font-bold text-gray-400 mb-6 uppercase tracking-widest">Label Settings</h3>
                <label class="block text-xs font-bold mb-2 ml-1">학습 단어 입력</label>
                <input type="text" id="action-input" placeholder="예: hello" class="custom-input mb-6">

                <div class="pt-6 border-t border-gray-100">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-sm font-medium text-gray-500">진행률 (Frames)</span>
                        <span id="frame-count" class="font-bold text-blue-600">0 / 30</span>
                    </div>
                    <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden">
                        <div id="progress-bar" class="bg-blue-600 h-full w-0 transition-all duration-100"></div>
                    </div>
                </div>
            </div>

            <div class="dashboard-card bg-[#202124]">
                <h3 class="text-[10px] font-bold text-gray-500 mb-4 uppercase tracking-widest">System Log</h3>
                <div class="log-container" id="log-box">
                    <p class="text-gray-500">> System initialized...</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const btnCollect = document.getElementById('btn-collect');
        const actionInput = document.getElementById('action-input');
        const logBox = document.getElementById('log-box');
        
        let isCollecting = false;
        let sequence = [];
        const sequenceLength = 30; 

        function addLog(msg, color = "#34a853") {
            const p = document.createElement('p');
            p.style.color = color;
            p.innerText = `> ${msg}`;
            logBox.appendChild(p);
            logBox.scrollTop = logBox.scrollHeight;
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        // [수정] 양손 인식을 위해 maxNumHands: 2 설정
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        function onResults(results) {
            document.getElementById('loading-msg').style.display = 'none';
            document.getElementById('connection-status').innerHTML = `<span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> CAMERA ACTIVE`;
            document.getElementById('connection-status').classList.replace('text-red-500', 'text-green-600');

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // 두 손 데이터를 저장할 임시 배열 (항상 고정된 크기 유지를 위해)
            let currentFrameData = [];

            if (results.multiHandLandmarks) {
                // 감지된 모든 손 그리기
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#ffffff', lineWidth: 2});
                    drawLandmarks(canvasCtx, landmarks, {color: '#1a73e8', lineWidth: 1, radius: 3});
                }

                // [데이터 수집 로직]
                if (isCollecting) {
                    // 데이터 일관성을 위해 두 손 좌표를 모두 추출 (한 손만 감지될 경우 나머지는 0으로 채움)
                    // 각 손당 21개 랜드마크 * 3(x,y,z) = 63개 데이터
                    for (let i = 0; i < 2; i++) {
                        if (results.multiHandLandmarks[i]) {
                            const lmData = results.multiHandLandmarks[i].map(lm => [lm.x, lm.y, lm.z]).flat();
                            currentFrameData.push(...lmData);
                        } else {
                            // 손이 감지되지 않으면 0으로 채운 63개의 데이터 추가
                            currentFrameData.push(...new Array(63).fill(0));
                        }
                    }
                    
                    sequence.push(currentFrameData);
                    
                    const progress = (sequence.length / sequenceLength) * 100;
                    document.getElementById('progress-bar').style.width = `${progress}%`;
                    document.getElementById('frame-count').innerText = `${sequence.length} / ${sequenceLength}`;

                    if (sequence.length === sequenceLength) {
                        saveData();
                    }
                }
            }
            canvasCtx.restore();
        }

        async function saveData() {
            isCollecting = false;
            btnCollect.disabled = false;
            actionInput.disabled = false;
            
            const action = actionInput.value.trim() || 'unnamed';
            addLog(`Saving 30 frames (Dual Hand) for [${action}]...`, "#fbbc05");

            try {
                const response = await fetch('/save-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: action,
                        data: sequence
                    })
                });
                const result = await response.json();
                addLog(result.message);
            } catch (err) {
                addLog("Error saving data!", "#ea4335");
            }
            
            sequence = [];
            setTimeout(() => {
                document.getElementById('progress-bar').style.width = '0%';
                document.getElementById('frame-count').innerText = `0 / 30`;
            }, 1000);
        }

        btnCollect.addEventListener('click', () => {
            if (!actionInput.value.trim()) {
                addLog("Please enter a label name first!", "#ea4335");
                return;
            }
            isCollecting = true;
            btnCollect.disabled = true;
            actionInput.disabled = true;
            sequence = [];
            addLog(`Started capturing for: ${actionInput.value}`);
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        camera.start();

        function resizeCanvas() {
            canvasElement.width = canvasElement.clientWidth;
            canvasElement.height = canvasElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
    </script>
</body>
</html>
