<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기초 수어 학습</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght=300;400;500;700&display=swap');
        :root { 
            --google-blue: #1a73e8; 
            --bg-light: #f8f9fa; 
            --surface: #ffffff; 
            --text-main: #202124; 
            --text-sub: #5f6368; 
            --border-color: #f1f3f4; 
            --google-red: #ea4335; 
            --google-green: #34a853;
        }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: var(--bg-light); color: var(--text-main); margin: 0; overflow: hidden; }
        
        header { background-color: var(--surface); border-bottom: 1px solid var(--border-color); height: 64px; }
        
        .learn-wrapper {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            height: calc(100vh - 120px);
            max-width: 1600px;
            margin: 80px auto 24px;
            padding: 0 24px;
        }

        .video-container {
            background: #000;
            border-radius: 32px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 1px 3px rgba(60,64,67,0.1);
        }

        #video-element { display: none; }
        #output-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: rotateY(180deg);
        }

        .video-state-msg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; text-align: center; z-index: 10;
        }

        .subtitle-area {
            position: absolute;
            top: 40px; left: 0; right: 0;
            text-align: center; padding: 0 60px; z-index: 5;
        }

        .subtitle-box {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            color: #fff;
            padding: 16px 32px;
            border-radius: 24px;
            font-size: 1.5rem;
            font-weight: 700;
            display: inline-block;
            min-width: 300px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .camera-controls {
            position: absolute;
            bottom: 24px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 16px; z-index: 20;
        }

        .action-btn {
            width: 56px; height: 56px;
            border-radius: 28px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            color: white;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .action-btn:hover { background: rgba(0, 0, 0, 0.6); }
        .action-btn.danger { background: var(--google-red); }
        .action-btn.active { background: var(--google-blue); }

        .learn-sidebar {
            background: var(--surface);
            border-radius: 32px;
            border: 1px solid var(--border-color);
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 1px 3px rgba(60,64,67,0.1);
        }

        .learn-header { padding: 24px; border-bottom: 1px solid var(--border-color); }
        .learn-content { flex-grow: 1; padding: 32px 24px; display: flex; flex-direction: column; justify-content: space-between; }
        
        .feedback-panel {
            background: var(--bg-light);
            border: 2px dashed #dadce0;
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .feedback-panel.success {
            background: #e6f4ea;
            border-color: var(--google-green);
            color: #137333;
        }
    </style>
</head>
<body>

    <header class="fixed top-0 left-0 w-full z-[1000] bg-white">
        <div class="max-w-7xl mx-auto px-6 h-full flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <a href="/" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors text-gray-600">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h2 class="text-lg font-medium">기초 수어 학습 모드</h2>
            </div>

            <div class="absolute left-1/2 -translate-x-1/2">
                <div class="flex items-center gap-2 px-4 py-1.5 bg-blue-50 text-blue-700 rounded-full text-xs font-bold border border-blue-100">
                    <i class="fa-solid fa-graduation-cap"></i>
                    AI 피드백 가이드 활성화됨
                </div>
            </div>

            <div class="flex items-center space-x-6">
                <div id="status-badge" class="flex items-center gap-2 px-3 py-1.5 bg-gray-100 rounded-full">
                    <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
                    <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">Connecting</span>
                </div>
                <div class="w-8 h-8 bg-gray-200 rounded-full border border-white"></div>
            </div>
        </div>
    </header>

    <main class="learn-wrapper">
        
        <aside class="learn-sidebar">
            <div class="learn-header">
                <h3 class="font-bold text-sm text-gray-400 tracking-wider uppercase">Today's Mission</h3>
            </div>
            
            <div class="learn-content">
                <div class="text-center py-6">
                    <span class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase tracking-wide">도전할 단어</span>
                    <h1 class="text-4xl font-black mt-4 text-gray-900 tracking-tight" id="target-word">안녕하세요</h1>
                    <p class="text-xs text-gray-500 mt-3 leading-relaxed">카메라를 바라보고 <br>해당 단어의 수어 동작을 정확하게 취하세요.</p>
                </div>

                <div class="feedback-panel" id="feedback-box">
                    <div id="feedback-icon-zone"></div>
                    <p class="text-sm font-bold text-gray-500" id="feedback-text">AI 가 동작 인식을 대기 중입니다</p>
                </div>

                <button onclick="nextMission()" class="w-full bg-gray-900 hover:bg-blue-600 text-white py-4 rounded-2xl text-sm font-bold transition-all shadow-md flex items-center justify-center gap-2">
                    다음 단어 도전
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>
        </aside>

        <section class="video-container">
            <video id="video-element"></video>
            <canvas id="output-canvas"></canvas>
            
            <div class="video-state-msg" id="loading-msg">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4 block text-white"></i>
                <p class="text-sm font-medium">인식 엔진 로딩 중...</p>
            </div>

            <div class="subtitle-area">
                <div class="subtitle-box" id="caption-display">동작을 시작하세요</div>
            </div>

            <div class="camera-controls">
                <button class="action-btn" onclick="location.reload()"><i class="fa-solid fa-rotate"></i></button>
                <button class="action-btn danger" onclick="location.href='/'"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </section>

    </main>

    <script>
        const video = document.getElementById('video-element');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const captionDisplay = document.getElementById('caption-display');
        const loadingMsg = document.getElementById('loading-msg');
        const statusBadge = document.getElementById('status-badge');
        
        const feedbackBox = document.getElementById('feedback-box');
        const feedbackText = document.getElementById('feedback-text');
        const feedbackIconZone = document.getElementById('feedback-icon-zone');

        const socket = io();
        
        // [수정] 채점 시 대소문자나 공백으로 인한 오류 방지를 위해 trim 처리
        const targetWord = document.getElementById('target-word').innerText.trim();

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        function onResults(results) {
            loadingMsg.style.display = 'none';
            statusBadge.innerHTML = `<span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span><span class="text-xs font-bold text-green-600 uppercase">Learning</span>`;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#ffffff', lineWidth: 2});
                    drawLandmarks(canvasCtx, landmarks, {color: '#1a73e8', lineWidth: 1, radius: 3});
                }
                socket.emit('video_frame', { landmarks: results.multiHandLandmarks });
            }
            canvasCtx.restore();
        }

        socket.on('translate_result', (data) => {
            const recognizedWord = data.word ? data.word.trim() : "";
            captionDisplay.innerText = data.word;

            // 실시간 채점 (인식된 단어가 '안녕하세요'와 일치할 때)
            if (recognizedWord === targetWord && data.confidence > 0.75) {
                feedbackBox.classList.add('success');
                // 정답 시에만 깔끔하게 초록색 체크 아이콘 생성
                feedbackIconZone.innerHTML = `<i class="fa-solid fa-circle-check text-4xl text-green-600 mb-3"></i>`;
                feedbackText.innerText = "🎉 미션 성공! 정확한 수어 동작입니다.";
                captionDisplay.style.background = "rgba(52, 168, 83, 0.8)";
            }
        });

        const camera = new Camera(video, {
            onFrame: async () => {
                await hands.send({image: video});
            },
            width: 1280,
            height: 720
        });
        camera.start();

        function nextMission() {
            alert("다음 문제 준비 중입니다!");
        }

        function resize() {
            canvasElement.width = canvasElement.clientWidth;
            canvasElement.height = canvasElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();
    </script>
</body>
</html>
